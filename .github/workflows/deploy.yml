name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test compiler and API
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node tests/test_browser_logic.cjs
          for file in public/*.js; do node --check "$file"; done
          node --check public/script.js
          node --check public/pyodide_bridge.js
          node --check public/easter_eggs.js
          node --check public/professor_celebration.js
          node --check public/walkthrough.js

      - name: Bundle compiler sources into the site
        run: |
          mkdir -p public/src
          cp src/*.py public/src/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
